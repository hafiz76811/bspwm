# =========================
# GENERAL
# =========================
confirm_os_window_close 0
background_opacity 0.80
dynamic_background_opacity yes

# =========================
# FONT
# =========================
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5

disable_ligatures never

# =========================
# CURSOR
# =========================
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# =========================
# SCROLLBACK
# =========================
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# =========================
# MOUSE
# =========================
mouse_hide_wait 1.0
copy_on_select yes
strip_trailing_spaces smart

# =========================
# COLORS (Dark Theme)
# =========================
include ~/.config/kitty/themes.conf

# =========================
# WINDOW LAYOUT
# =========================
window_padding_width 10

# =========================
# KEYBINDINGS
# =========================

# Reload config
map ctrl+r reload_config

# Clear terminal
map ctrl+l clear

# Copy paste
map ctrl+y copy_to_clipboard
map ctrl+p paste_from_clipboard

# Scroll
map ctrl+k scroll_page_up
map ctrl+j scroll_page_down

# =========================
# PERFORMANCE
# =========================
repaint_delay 10
input_delay 3
sync_to_monitor yes

# =========================
# SHELL
# =========================
shell $SHELL

# =========================
# EDITOR
# =========================
editor $EDITOR

# =========================
# CLIPBOARD
# =========================
clipboard_control write-clipboard write-primary read-clipboard read-primary

# =========================
# ADVANCED
# =========================
shell_integration enabled

# URL handling
allow_hyperlinks yes
open_url_with $BROWSER
detect_urls yes

# =========================
# BACKGROUND IMAGE (optional)
# =========================
# background_image ~/.config/backgrounds/wallpaper1.jpg
# background_image_layout cover

