[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/mybar]
width = 100%
height = 24pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font;3"

modules-left = xworkspaces xwindow
modules-center = audio date record
modules-right = filesystem pulseaudio xkeyboard memory cpu battery wlan eth

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = bspwm

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/bspwm

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

; [module/wlan]
; inherit = network-base
; interface-type = wireless
; label-connected = %{F#F0C674}%ifname%%{F-} %essid%

; click-left = ~/.config/polybar/network.sh

[module/wlan]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
format-prefix = "wlo1 "
format-prefix-foreground = ${colors.primary}
format-foreground = ${colors.foreground}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/audio]
type = custom/script
exec = ~/.config/polybar/scripts/audio.sh
interval = 5
format-prefix = "AUD "
format-prefix-foreground = ${colors.primary}
format-foreground = ${colors.foreground}

[module/record]
type = custom/script
exec = ~/.config/polybar/scripts/record.sh
interval = 5
format-prefix = "REC "
format-prefix-foreground = ${colors.primary}
format-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC0
poll-interval = 5

; time-format = %H:%M

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <label-low>
label-charging = %{F#F0C674}CHAR%{F-} %percentage%%
label-discharging = %{F#F0C674}BAT%{F-} %percentage%%
label-full = %{F#F0C674}FULL%{F-} %percentage%%
label-low = %{F#F0C674}LOW%{F-} %percentage%%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %a, %d/%m/%y

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
